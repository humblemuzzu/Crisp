name: Crisp
options:
  bundleIdPrefix: com.crisp
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - Base

targets:
  Crisp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Crisp
        excludes:
          - "**/*.md"
          # Added back below as a folder reference so the JSON keeps its
          # directory inside Contents/Resources (see MonitorQuirksService).
          - "Resources/quirks"
      - path: Crisp/Resources/quirks
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crisp.app
        # Without an explicit MARKETING_VERSION the generated Info.plist omits
        # CFBundleShortVersionString and the app self-reports 1.0.0 forever,
        # which keeps the update banner visible even on the latest release.
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "Crisp - Free & Open Source"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Crisp uses System Events to switch Dark Mode with the system's animated transition."
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: Crisp/Crisp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: Crisp/Crisp-Bridging-Header.h
        # SLSConfigureDisplayEnabled / SLSGetDisplayList live in the private
        # SkyLight.framework (physical display disconnect). SkyLight is already
        # loaded in-process via AppKit, so mark just these two symbols as
        # resolved-at-runtime instead of hard-linking a private framework path.
        OTHER_LDFLAGS: "-Wl,-U,_SLSConfigureDisplayEnabled -Wl,-U,_SLSGetDisplayList"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CrispTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CrispTests
      - path: Crisp/Models/DisplayModeGeometry.swift
      - path: Crisp/Models/DDCServiceMatcher.swift
      - path: Crisp/Models/DDCPacket.swift
      - path: Crisp/Models/DDCTransport.swift
      - path: Crisp/Models/DDCProtocolEngine.swift
      # The declarative VCP registry (DDCFeatureRegistryTests): which codes exist,
      # what shape their values are, which of them can cost the user something.
      # `QuirkFeatureName` is an alias for its `DDCFeatureID`, so this file is a
      # prerequisite of MonitorQuirks.swift below rather than an addition to it.
      - path: Crisp/Models/DDCFeatureRegistry.swift
      # The capabilities-string parser (DDCCapabilitiesTests). Every tolerance
      # rule in it is pinned by a verbatim string from a real monitor, which is
      # only possible because the parser is pure text in, values out.
      - path: Crisp/Models/DDCCapabilities.swift
      # The discovery rule (DDCFeatureDiscoveryTests): capabilities may widen what
      # is offered and never narrow it, and nothing unproven is writable. Both are
      # tests here rather than conventions in a review.
      - path: Crisp/Models/DDCFeatureDiscovery.swift
      - path: Crisp/Models/RefreshRateFormat.swift
      - path: Crisp/Models/GammaPersistenceKey.swift
      - path: Crisp/Models/DisplayUUID.swift
      - path: Crisp/Models/DisplayStateDocument.swift
      # Forward compatibility for the document: the unknown-field bag that makes
      # a rollback lossless, and the element-wise list decode that stops one bad
      # schedule from costing the user their brightness (DisplayStateStoreTests).
      - path: Crisp/Models/JSONValue.swift
      # Display groups and the brightness-sync arithmetic (BrightnessSyncTests).
      # Pure: which member ends up at what percentage, the origin token that makes
      # a propagation one level deep, and the clamp that stops a pinned member
      # dragging the group. None of it needs two monitors.
      - path: Crisp/Models/DisplayGroup.swift
      # DDC presets and the plan that turns one into writes (DDCPresetTests).
      # The property that matters — a preset cannot carry a destructive feature —
      # is asserted here over the whole registry, not trusted at the call sites.
      - path: Crisp/Models/DDCPreset.swift
      # Schedules and the firing rule (PresetScheduleTests): a missed 22:00 fires
      # once on wake, and not fourteen times. Pure and calendar-injected, which is
      # what makes "it survives sleep" a test rather than an overnight experiment.
      - path: Crisp/Models/PresetSchedule.swift
      # The I/O half of the store (DisplayStateStoreIOTests). Foundation +
      # AppKit's terminate notification only, so it stays headless.
      - path: Crisp/Services/DisplayStateStore.swift
      - path: Crisp/Models/CombinedBrightness.swift
      # The brightness fallback ladder's decision core (BrightnessRungTests).
      # Foundation only: the AppKit overlay window lives elsewhere.
      - path: Crisp/Models/BrightnessRung.swift
      - path: Crisp/Models/VariableRefreshModes.swift
      # The monitor quirks decision core (decode / merge / resolve),
      # Foundation only. Its bundle-lookup half, Services/MonitorQuirksService.swift,
      # deliberately stays out of the test target: it holds no decisions.
      - path: Crisp/Models/MonitorQuirks.swift
      # Diagnostic facts → markdown bug report, and the per-feature support rule
      # (DisplayDiagnosticsTests). Foundation only; the collection half,
      # Services/DisplayDiagnosticsService.swift, holds no decisions.
      - path: Crisp/Models/DisplayDiagnostics.swift
      # Probe results → a quirks JSON entry (QuirkEntryDraftTests), which those
      # tests push back through MonitorQuirks' real decoder: a generator whose
      # output the loader rejects is worse than no generator.
      - path: Crisp/Models/QuirkEntryDraft.swift
      # The input-source calibration wizard's decision core: candidate list,
      # the keep/revert state machine, and the crash-recovery rule
      # (InputCalibrationTests). Every safety property here has to hold with the
      # screen black, so all of it is pure and none of it is in the view — which
      # is also what lets a whole multi-step session be driven headlessly,
      # without ever executing a VCP 0x60 write.
      - path: Crisp/Models/InputCalibration.swift
      # The glue around that state machine (InputCalibrationDriverTests): when a
      # deferred close may be honoured, when a reconnect may repair a display the
      # session has given up on, and when a new session may adopt the code the
      # monitor is on. Three shipped bugs lived in this layer because it used to
      # sit in Services/ with no coverage; the impure edges (the 0x60 write, the
      # tick source, the store, the display list) are injected as closures, so it
      # runs here with no monitor and no write ever issued.
      - path: Crisp/Models/InputCalibrationDriver.swift
      # Confirmed session → a `verified` quirks entry. The one generator in the
      # app allowed to emit `verified`, so its tests push the output back through
      # MonitorQuirks' decoder and assert the loader agrees.
      - path: Crisp/Models/InputCalibrationReport.swift
      # The automation surface's decision core (AutomationRequestTests): what a
      # URL, a shortcut or a hotkey is allowed to ask for. The property that
      # matters — no automation origin can apply a destructive VCP write on its
      # own — is asserted here over the whole registry rather than trusted at the
      # three entry points.
      - path: Crisp/Models/AutomationRequest.swift
      # The crisp:// grammar (CrispURLTests). Pure text in, a request or a
      # refusal out, which is what lets a hostile URL be tested without
      # registering a URL handler or running the app.
      - path: Crisp/Models/CrispURL.swift
      # Global keyboard shortcuts as data (HotkeyBindingTests): which combinations
      # are legal, and what happens when two actions want the same one. Carbon
      # lives in Crisp/Services/HotkeyService.swift; none of it is needed to test
      # the rules.
      - path: Crisp/Models/HotkeyBinding.swift
      # The first-run guide's decision core (OnboardingPlanTests): which screens
      # to show, what each attached display means, the no-monitor case. Foundation
      # only; the window and its prose live in Crisp/Views/OnboardingView.swift.
      - path: Crisp/Models/OnboardingPlan.swift
      # Smart TVs. A television has no DDC/CI, so the whole feature is protocol
      # work over a network — and there is no TV on the machine this is developed
      # on, which makes headless tests the only way any of it can be known to
      # work rather than merely believed to. All five files are pure text in,
      # values out, sitting above the `TVTransport` seam exactly as DDCPacket /
      # DDCProtocolEngine sit above DDCTransport.
      #
      # Which features exist per platform and what each costs to get wrong —
      # including the fact that Tizen has no remote brightness command at all
      # (TVDeviceTests asserts it over the whole registry).
      - path: Crisp/Models/TVDevice.swift
      # The wire seam and its timeouts. In the test target so `FakeTVTransport`
      # can conform to it.
      - path: Crisp/Models/TVTransport.swift
      # Trust-on-first-use for the self-signed certificates both platforms use
      # (TVTrustTests): first sight pins, a mismatch refuses and is never
      # silently re-pinned. Pure, so the mismatch is a unit test rather than
      # something you would have to stage a man-in-the-middle to reach.
      - path: Crisp/Models/TVTrust.swift
      # LG's SSAP: envelope, id correlation, the pairing state machine, and the
      # createAlert round trip that is the only working way to write a modern
      # webOS backlight (WebOSProtocolTests).
      - path: Crisp/Models/WebOSProtocol.swift
      # Samsung's remote protocol: detection, the two token locations, the key
      # frames and the one-key-per-second pacing (TizenProtocolTests).
      - path: Crisp/Models/TizenProtocol.swift
      # What automation may ask a TV for, and the destructive rule for power and
      # input (TVActionTests). Asserted over the whole TV registry, exactly as
      # AutomationRequestTests is over the VCP one.
      - path: Crisp/Models/TVAction.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crisp.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  crispctl:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: crispctl
      - path: Crisp/Services/DDCService.swift
      - path: Crisp/Services/IOKitDDCTransport.swift
      - path: Crisp/Models/DDCPacket.swift
      - path: Crisp/Models/DDCTransport.swift
      - path: Crisp/Models/DDCProtocolEngine.swift
      - path: Crisp/Models/DDCServiceMatcher.swift
      - path: Crisp/Models/DDCCapabilities.swift
      - path: Crisp/Models/DDCFeatureRegistry.swift
      # `crispctl list` prints each display's stable UUID, because that is what a
      # crisp:// link and a Shortcuts action have to name. Derived by the same
      # functions the app uses so the two spellings cannot drift.
      - path: Crisp/Models/DisplayUUID.swift
      # `crispctl preset list|apply` reads the app's own displays.json rather
      # than keeping a second copy of the presets, so these are the document, its
      # migration, and the preset model and plan the app applies presets with.
      - path: Crisp/Models/DisplayStateDocument.swift
      - path: Crisp/Models/JSONValue.swift
      - path: Crisp/Models/DisplayGroup.swift
      - path: Crisp/Models/DDCPreset.swift
      - path: Crisp/Models/PresetSchedule.swift
      # `crispctl tv` drives the same televisions the app pairs, through the same
      # conversation (`TVConversation`) and the same Keychain items — a second
      # implementation would be wrong in one of the two within a release. What it
      # deliberately does NOT link is `DDCFeatureDiscovery`/`TVAction`: the app's
      # write gate needs a `DestructiveWriteConsent`, the only two things that
      # mint one are a SwiftUI alert and an NSAlert, and declaring a third
      # conformer for a command line is the escape hatch AGENTS.md warns about.
      # The CLI reproduces the part that protects the user instead — the hazard
      # and a deliberate second step (`confirmDestructiveTV`), exactly as it
      # already does for destructive VCP codes.
      - path: Crisp/Models/TVDevice.swift
      - path: Crisp/Models/TVTransport.swift
      - path: Crisp/Models/TVTrust.swift
      - path: Crisp/Models/WebOSProtocol.swift
      - path: Crisp/Models/TizenProtocol.swift
      - path: Crisp/Services/TVConversation.swift
      - path: Crisp/Services/TVWebSocketTransport.swift
      - path: Crisp/Services/TVCredentialStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crisp.cli
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: Crisp/Crisp-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        # The entry point is `@main struct CrispCLI` in a file called main.swift,
        # which Swift otherwise treats as top-level code ("'main' attribute cannot
        # be used in a module that contains top-level code"). The Makefile's
        # swiftc line already passes this; without it here, every xcodebuild over
        # the project fails on this target — including `make loc-check` and CI's
        # localization step, which build the whole project to extract strings.
        OTHER_SWIFT_FLAGS: "-parse-as-library"

schemes:
  Crisp:
    build:
      targets:
        Crisp: all
    test:
      targets:
        - CrispTests
