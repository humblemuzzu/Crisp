name: Crisp
options:
  bundleIdPrefix: com.crisp
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  knownRegions:
    - en
    - zh-Hans
    - Base

targets:
  Crisp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Crisp
        excludes:
          - "**/*.md"
          # Added back below as a folder reference so the JSON keeps its
          # directory inside Contents/Resources (see MonitorQuirksService).
          - "Resources/quirks"
      - path: Crisp/Resources/quirks
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crisp.app
        # Without an explicit MARKETING_VERSION the generated Info.plist omits
        # CFBundleShortVersionString and the app self-reports 1.0.0 forever,
        # which keeps the update banner visible even on the latest release.
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: "5"
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_NSHumanReadableCopyright: "Crisp - Free & Open Source"
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "Crisp uses System Events to switch Dark Mode with the system's animated transition."
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: Crisp/Crisp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: Crisp/Crisp-Bridging-Header.h
        # SLSConfigureDisplayEnabled / SLSGetDisplayList live in the private
        # SkyLight.framework (physical display disconnect). SkyLight is already
        # loaded in-process via AppKit, so mark just these two symbols as
        # resolved-at-runtime instead of hard-linking a private framework path.
        OTHER_LDFLAGS: "-Wl,-U,_SLSConfigureDisplayEnabled -Wl,-U,_SLSGetDisplayList"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CrispTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: CrispTests
      - path: Crisp/Models/DisplayModeGeometry.swift
      - path: Crisp/Models/DDCServiceMatcher.swift
      - path: Crisp/Models/DDCPacket.swift
      - path: Crisp/Models/DDCTransport.swift
      - path: Crisp/Models/DDCProtocolEngine.swift
      # The declarative VCP registry (DDCFeatureRegistryTests): which codes exist,
      # what shape their values are, which of them can cost the user something.
      # `QuirkFeatureName` is an alias for its `DDCFeatureID`, so this file is a
      # prerequisite of MonitorQuirks.swift below rather than an addition to it.
      - path: Crisp/Models/DDCFeatureRegistry.swift
      # The capabilities-string parser (DDCCapabilitiesTests). Every tolerance
      # rule in it is pinned by a verbatim string from a real monitor, which is
      # only possible because the parser is pure text in, values out.
      - path: Crisp/Models/DDCCapabilities.swift
      # The discovery rule (DDCFeatureDiscoveryTests): capabilities may widen what
      # is offered and never narrow it, and nothing unproven is writable. Both are
      # tests here rather than conventions in a review.
      - path: Crisp/Models/DDCFeatureDiscovery.swift
      - path: Crisp/Models/RefreshRateFormat.swift
      - path: Crisp/Models/GammaPersistenceKey.swift
      - path: Crisp/Models/DisplayUUID.swift
      - path: Crisp/Models/DisplayStateDocument.swift
      # The I/O half of the store (DisplayStateStoreIOTests). Foundation +
      # AppKit's terminate notification only, so it stays headless.
      - path: Crisp/Services/DisplayStateStore.swift
      - path: Crisp/Models/CombinedBrightness.swift
      # The brightness fallback ladder's decision core (BrightnessRungTests).
      # Foundation only: the AppKit overlay window lives elsewhere.
      - path: Crisp/Models/BrightnessRung.swift
      - path: Crisp/Models/VariableRefreshModes.swift
      # The monitor quirks decision core (decode / merge / resolve),
      # Foundation only. Its bundle-lookup half, Services/MonitorQuirksService.swift,
      # deliberately stays out of the test target: it holds no decisions.
      - path: Crisp/Models/MonitorQuirks.swift
      # Diagnostic facts → markdown bug report, and the per-feature support rule
      # (DisplayDiagnosticsTests). Foundation only; the collection half,
      # Services/DisplayDiagnosticsService.swift, holds no decisions.
      - path: Crisp/Models/DisplayDiagnostics.swift
      # Probe results → a quirks JSON entry (QuirkEntryDraftTests), which those
      # tests push back through MonitorQuirks' real decoder: a generator whose
      # output the loader rejects is worse than no generator.
      - path: Crisp/Models/QuirkEntryDraft.swift
      # The input-source calibration wizard's decision core: candidate list,
      # the keep/revert state machine, and the crash-recovery rule
      # (InputCalibrationTests). Every safety property here has to hold with the
      # screen black, so all of it is pure and none of it is in the view — which
      # is also what lets a whole multi-step session be driven headlessly,
      # without ever executing a VCP 0x60 write.
      - path: Crisp/Models/InputCalibration.swift
      # The glue around that state machine (InputCalibrationDriverTests): when a
      # deferred close may be honoured, when a reconnect may repair a display the
      # session has given up on, and when a new session may adopt the code the
      # monitor is on. Three shipped bugs lived in this layer because it used to
      # sit in Services/ with no coverage; the impure edges (the 0x60 write, the
      # tick source, the store, the display list) are injected as closures, so it
      # runs here with no monitor and no write ever issued.
      - path: Crisp/Models/InputCalibrationDriver.swift
      # Confirmed session → a `verified` quirks entry. The one generator in the
      # app allowed to emit `verified`, so its tests push the output back through
      # MonitorQuirks' decoder and assert the loader agrees.
      - path: Crisp/Models/InputCalibrationReport.swift
      # The first-run guide's decision core (OnboardingPlanTests): which screens
      # to show, what each attached display means, the no-monitor case. Foundation
      # only; the window and its prose live in Crisp/Views/OnboardingView.swift.
      - path: Crisp/Models/OnboardingPlan.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crisp.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TEST_HOST: ""
        BUNDLE_LOADER: ""

  crispctl:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: crispctl
      - path: Crisp/Services/DDCService.swift
      - path: Crisp/Services/IOKitDDCTransport.swift
      - path: Crisp/Models/DDCPacket.swift
      - path: Crisp/Models/DDCTransport.swift
      - path: Crisp/Models/DDCProtocolEngine.swift
      - path: Crisp/Models/DDCServiceMatcher.swift
      - path: Crisp/Models/DDCCapabilities.swift
      - path: Crisp/Models/DDCFeatureRegistry.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crisp.cli
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_OBJC_BRIDGING_HEADER: Crisp/Crisp-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES
        # The entry point is `@main struct CrispCLI` in a file called main.swift,
        # which Swift otherwise treats as top-level code ("'main' attribute cannot
        # be used in a module that contains top-level code"). The Makefile's
        # swiftc line already passes this; without it here, every xcodebuild over
        # the project fails on this target — including `make loc-check` and CI's
        # localization step, which build the whole project to extract strings.
        OTHER_SWIFT_FLAGS: "-parse-as-library"

schemes:
  Crisp:
    build:
      targets:
        Crisp: all
    test:
      targets:
        - CrispTests
